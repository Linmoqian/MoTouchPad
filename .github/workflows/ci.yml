name: Application CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shared protocol fixtures
        run: python tools/validate_protocol_fixtures.py

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"
      - name: Build, lint and test
        working-directory: android-app
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest

  apple:
    name: Apple apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test macOS app
        working-directory: mac-app
        run: |
          swift build
          swift test
      - name: Build iOS app without signing
        run: >
          xcodebuild -project ios-app/ios-app.xcodeproj
          -scheme MoTouchPad
          -destination 'generic/platform=iOS'
          build CODE_SIGNING_ALLOWED=NO
      - name: Test iOS codec against shared fixtures
        run: |
          swiftc \
            ios-app/App/Model/TouchModels.swift \
            ios-app/App/Protocol/TouchFrameCodec.swift \
            tools/IOSProtocolFixtureTest.swift \
            -o "$RUNNER_TEMP/motouchpad-ios-protocol-test"
          "$RUNNER_TEMP/motouchpad-ios-protocol-test"

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build WPF application
        run: dotnet build windows-app/MoTouchPad.Windows.csproj --configuration Release
      - name: Run C# protocol conformance test
        run: dotnet run --project tools/ProtocolSmokeTest/ProtocolSmokeTest.csproj --configuration Release

# DriverKit and WDK projects intentionally remain outside application CI.
# They require platform-specific SDKs, signing state and manual hardware checks.
